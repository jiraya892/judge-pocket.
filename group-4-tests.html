<script>const names=['JudgeGroup4ATests','JudgeGroup4Tests','JudgeGroup4BTests','JudgeGroup4CTests','JudgeGroup4DTests','JudgeGroup4ETests','JudgeGroup4FTests','JudgeGroup4F1Tests','JudgeGroup4F2Tests','JudgeGroup4F3Tests','JudgeGroup4F4Tests','JudgeGroup4F5Tests','JudgeGroup4F6Tests','JudgeGroup4F7Tests','JudgeGroup3Tests'];let passed=0,total=0;const lines=[];for(const name of names){try{const r=window[name].run();passed+=r.passed;total+=r.total;lines.push(name+': '+r.passed+'/'+r.total);for(const x of r.tests)if(!x.pass)lines.push('  ✕ '+x.name)}catch(e){lines.push(name+': ERRORE '+e.message)}}document.getElementById('results').textContent=passed+'/'+total+' test superati\n'+lines.join('\n');</script></body></html>
