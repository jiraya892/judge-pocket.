<script>const names=['JudgeGroup4ATests','JudgeGroup4Tests','JudgeGroup4BTests','JudgeGroup4CTests','JudgeGroup4DTests','JudgeGroup4ETests','JudgeGroup4FTests','JudgeGroup4F1Tests','JudgeGroup4F2Tests','JudgeGroup4F3Tests','JudgeGroup4F4Tests','JudgeGroup4F5Tests','JudgeGroup4F6Tests','JudgeGroup4F7Tests','JudgeGroup3Tests','JudgeGroup5ATests','JudgeGroup5BTests','JudgeGroup5CTests','JudgeGroup5DTests','JudgeGroup5ETests','JudgeGroup5FTests','JudgeGroup5FZoneTests','JudgeGroup5FTriggerTests','JudgeGroup5GTests','JudgeGroup5GIntegrationTests','JudgeGroup5GSBATests'];function runAll(){let passed=0,total=0,errors=0;const lines=[];for(const name of names){try{const r=window[name].run();passed+=r.passed;total+=r.total;lines.push(name+': '+r.passed+'/'+r.total);for(const x of r.tests)if(!x.pass)lines.push('  ✕ '+x.name)}catch(e){errors++;lines.push(name+': ERRORE '+e.message)}}const success=errors===0&&passed===total&&total===313;document.getElementById('results').textContent=(success?'PASS':'FAIL')+' — '+passed+'/'+total+' test superati, '+errors+' errori di esecuzione\n'+lines.join('\n');document.getElementById('environment').textContent='Browser: '+navigator.userAgent+' | Online: '+navigator.onLine+' | Service worker: '+('serviceWorker' in navigator?'supportato':'non supportato');return success;}document.getElementById('rerun').onclick=runAll;runAll();</script></body></html>
