name: Pocket Judge regression tests
on:
  push:
    branches: [main, feature/rules-engine-foundation, dev/groups-5f-5h]
    paths-ignore:
      - 'test-reports/latest/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic rules and turn tests
        id: regression
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-reports
          node verify-tests.cjs 2>&1 | tee test-reports/core.log
          node verify-groups-5h.cjs 2>&1 | tee test-reports/groups.log
      - name: Publish readable test summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Judge Pocket — Regression results'
            echo ''
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Result: \`${{ steps.regression.outcome }}\`"
            echo ''
            echo '### Core tests'
            if [ -f test-reports/core.log ]; then
              grep '^Total:' test-reports/core.log || tail -n 15 test-reports/core.log
            else
              echo 'Core runner did not produce a log.'
            fi
            echo ''
            echo '### Group suites'
            if [ -f test-reports/groups.log ]; then
              grep '^Browser suites:' test-reports/groups.log || tail -n 15 test-reports/groups.log
            else
              echo 'Group runner did not produce a log.'
            fi
          } | tee test-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-pocket-test-report
          path: test-reports/
          retention-days: 30
      - name: Save latest report to development branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev/groups-5f-5h'
        shell: bash
        run: |
          mkdir -p test-reports/latest
          cp test-reports/*.log test-reports/latest/ 2>/dev/null || true
          cp test-reports/summary.md test-reports/latest/summary.md
          printf '%s\n' "$GITHUB_SHA" > test-reports/latest/verified-commit.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-reports/latest/
          if ! git diff --cached --quiet; then
            git commit -m "ci(report): store latest regression results [skip ci]"
            git push origin HEAD:dev/groups-5f-5h
          fi
