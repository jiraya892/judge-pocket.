name: Chapter 16 planner checks
on:
  push:
    branches: [dev/chapter-16-question-planner]
    paths:
      - 'question-planner.js'
      - 'question-planner.test.cjs'
      - 'guided-bridge.js'
      - 'context-ui.js'
      - 'context-interview.js'
      - 'game-facts.js'
      - '.github/workflows/chapter-16-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  planner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run planner tests
        run: node question-planner.test.cjs
