utton><div id="answerReview" hidden></div><input id="extraName" placeholder="Nome del permanente aggiuntivo" hidden><button id="addExtra" hidden>Aggiungi permanente</button><textarea id="description" placeholder="Descrivi la situazione" hidden></textarea><button id="sendDescription" hidden>Conferma</button></section><section id="result" hidden><h2>Situazione raccolta</h2><p id="summary"></p><p id="status"></p><button id="copyDiagnostic" class="option" hidden>Copia rapporto per aggiungere il supporto</button><button id="restart">Nuova interazione</button></section></main><script src="./fact-clarifier.js"></script><script src="./required-facts.js"></script><script src="./conditional-facts.js"></script><script src="./interview-flow.js"></script><script src="./context-interview.js"></script><script src="./scenario-minimum-tests.js"></script><script src="./rules-core.js"></script><script src="./layer-engine.js"></script><script src="./land-layer-engine.js"></script><script src="./continuous-state.js"></script><script src="./effect-lifetime.js"></script><script src="./effect-model.js"></script><script src="./dependency-engine.js"></script><script src="./unified-layer4.js"></script><script src="./pt-layers.js"></script><script src="./copy-layer.js"></script><script src="./unified-continuous.js"></script><script src="./judge-coordinator.js"></script><script src="./outcome-trust.js"></script><script src="./local-rules-source.js"></script><script src="./evidence-ledger.js"></script><script src="./oracle-recognition.js"></script><script src="./sba-preview.js"></script><script src="./game-facts.js"></script><script src="./guided-bridge.js"></script><script src="./explanation-view.js"></script><script src="./context-ui.js"></script><script src="./photo-intake.js"></script><script src="./photo-recognition.js"></script><script src="./photo-session.js"></script><script src="./photo-workflow.js"></script><script src="./guided-card-input.js"></script><script src="./replacement-engine
